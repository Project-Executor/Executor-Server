# 테스트 전용 설정: Railway DB가 아니라 로컬 MySQL의 executor_test DB를 사용한다.
# 준비: 로컬 MySQL에 executor_test DB를 만들고 src/main/resources/db/schema.sql을 실행해 둘 것.
#   mysql -u root -p -e "CREATE DATABASE executor_test"
#   mysql -u root -p executor_test < src/main/resources/db/schema.sql
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/executor_test?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}

# 테스트 전용 JWT 키 (운영 키와 다른 값)
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1leGVjdXRvci1zZXJ2ZXItdGVzdHM=

spring.data.redis.host=${TEST_REDIS_HOST:localhost}
spring.data.redis.port=${TEST_REDIS_PORT:6379}
spring.data.redis.password=
