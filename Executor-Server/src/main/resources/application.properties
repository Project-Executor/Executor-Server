spring.application.name=Executor-Server

# 로컬 실행 시 프로젝트 루트의 .env 값을 읽는다. (Railway 배포 시에는 서비스 Variables가 쓰이고 .env는 없음)
spring.config.import=optional:file:.env[.properties]

# MySQL (Railway)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: 테이블 구조의 기준은 src/main/resources/db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
