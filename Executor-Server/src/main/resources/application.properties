spring.application.name=Executor-Server

# 로컬 실행 시 프로젝트 루트의 .env 값을 읽는다. (Railway 배포 시에는 서비스 Variables가 쓰이고 .env는 없음)
spring.config.import=optional:file:.env[.properties]

# Railway는 PORT 환경 변수로 포트를 지정한다
server.port=${PORT:8080}

# MySQL (Railway)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: 테이블 구조의 기준은 src/main/resources/db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Redis (Refresh Token 저장). Railway Redis 서비스를 추가하면 .env / Variables에 값을 넣는다.
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDISPASSWORD:}

# JWT: Access Token 30분, Refresh Token 14일
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600

# 페이지 단위 조회: 기본 20개, 최대 50개
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
